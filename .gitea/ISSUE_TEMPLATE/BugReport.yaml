name: Bug Report
about: File a bug report
title: '[Bug]: '
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description:
              Provide a clear and concise description of what the issue is that the bug report is trying to solve. Ex.
              Ticket information is not being saved when [...]
          placeholder: Tell us what you see!
          value: 'A bug happened!'
      validations:
          required: true
    - type: textarea
      id: expected-result
      attributes:
          label: What did you expect to happen?
          description: Provide a clear and concise description of what you expected to happen.
          placeholder: Tell us what you see!
          value: 'For it to work!'
      validations:
          required: true
    - type: dropdown
      id: browsers
      attributes:
          label: What browsers are you seeing the problem on?
          multiple: true
          options:
              - Firefox
              - Chrome
              - Safari
              - Microsoft Edge
    - type: textarea
      id: logs
      attributes:
          label: Relevant log output
          description:
              Please copy and paste any relevant log output. This will be automatically formatted into code, so no need
              for backticks.
          render: shell
