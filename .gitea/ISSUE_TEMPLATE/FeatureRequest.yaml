name: Feature Request
about: Suggest an idea for this project
title: '[FR]: '
body:
    - type: textarea
      id: summary
      attributes:
          label: Summary of request
          description: |
              Provide a clear and concise description of what the problem is that the feature request is trying to solve.
          placeholder: Tell us what you see!
          value: "Ex. I'm always frustrated when [...]"
      validations:
          required: true
    - type: textarea
      id: use-case
      attributes:
          label: Primary use case
          description: Describe the primary use case for this feature. Ex. As a user, I want to be able to [...]
          placeholder: Tell us what you see!
          value: 'Ex. As a user, I want to be able to [...]'
      validations:
          required: true
    - type: dropdown
      id: urgency
      attributes:
          label: How urgent is this feature?
          multiple: false
          options:
              - Low - Nice to have
              - Medium - This is a need, but work can continue
              - High - I can't work without this
